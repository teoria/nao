services:
  agent:
    build: .
    env_file:
      - project/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./project:/app/project
    ports:
      - "80:5005"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
